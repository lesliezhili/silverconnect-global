<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - SilverConnect</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f9fafb; }
    .container { text-align: center; max-width: 400px; }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 28px; color: #111827; margin: 0 0 12px; }
    p { font-size: 20px; color: #6b7280; margin: 0 0 24px; }
    button { background: #059669; color: white; border: none; padding: 16px 32px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; min-height: 56px; }
    button:active { background: #047857; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">&#x1F4F5;</div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
